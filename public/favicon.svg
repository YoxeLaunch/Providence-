<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <!-- Soft atmospheric blue glow on backlit planet rim -->
    <radialGradient id="atmoGlow" cx="75%" cy="25%" r="70%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.7"/>
      <stop offset="40%" stop-color="#0ea5e9" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#02040a" stop-opacity="0.95"/>
    </radialGradient>

    <!-- Star flare halo -->
    <radialGradient id="starBloom" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="1"/>
      <stop offset="45%" stop-color="#7dd3fc" stop-opacity="0.75"/>
      <stop offset="85%" stop-color="#0284c7" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- 1. Outer Orbit Ring (Crisp luminous stroke) -->
  <circle cx="32" cy="32" r="27" fill="none" stroke="#ffffff" stroke-width="2.2" opacity="0.45" />

  <!-- 2. Planet Sphere Core (Dark celestial body backlit by star) -->
  <circle cx="32" cy="32" r="19" fill="#04060e" stroke="#ffffff" stroke-width="2" opacity="0.9" />

  <!-- 3. Atmospheric Crescent Glow -->
  <circle cx="32" cy="32" r="18.5" fill="url(#atmoGlow)" />

  <!-- 4. Celestial Star / Moon Halo & Core at 45° -->
  <circle cx="51.1" cy="12.9" r="9.5" fill="url(#starBloom)" />
  <circle cx="51.1" cy="12.9" r="4.6" fill="#ffffff" />
</svg>
